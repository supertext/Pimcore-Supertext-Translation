version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/assets"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Pimcore Studio shares React 18.3 with the plugin through Module Federation
      # (@pimcore/studio-ui-bundle depends on react/react-dom 18.3.x): the plugin must use the host's React.
      - dependency-name: "react"
        versions: [">=19"]
      - dependency-name: "react-dom"
        versions: [">=19"]
      - dependency-name: "@types/react"
        versions: [">=19"]
      - dependency-name: "@types/react-dom"
        versions: [">=19"]
      # Studio 2026.3's build plugins (pluginGenerateEntrypoints, pluginWriteBuildId) are made for Rsbuild 1.
      - dependency-name: "@rsbuild/core"
        versions: [">=2"]
      - dependency-name: "@rsbuild/plugin-react"
        versions: [">=2"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/tests/docs"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directories: ["/tests/e2e"]
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Base images are pinned by digest (OpenSSF Scorecard: Pinned-Dependencies); this keeps the
  # digests and patch/minor tags current. Majors (a new Node, PHP, … line) are a decision, not an update.
  - package-ecosystem: "docker"
    directories:
      - "/demo"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
